<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>stc Buildings Inspection</title>
<style>
  :root{
    --purple-950:#2A0F45;
    --purple-800:#3D1A5B;
    --purple-700:#4C2172;
    --magenta:#E31C79;
    --magenta-dim:#F7D9E8;
    --paper:#FAF8FC;
    --card:#FFFFFF;
    --ink:#211A2B;
    --ink-dim:#6C6478;
    --line:#E7E1EE;
    --ok:#1E8E5A;
    --ok-bg:#E6F4EC;
    --bad:#D64545;
    --bad-bg:#FCE9E9;
    --na:#8A8294;
    --na-bg:#EFEDF2;
    --warn:#C9820F;
    --warn-bg:#FBF0DD;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  input,textarea{font-family:inherit;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(135deg,var(--purple-950),var(--purple-800) 60%,var(--magenta));
    color:#fff; padding:14px 16px 16px;
    box-shadow:0 4px 14px rgba(42,15,69,.25);
  }
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; flex-direction:column; line-height:1.1;}
  .brand .eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.75; font-weight:600;}
  .brand h1{font-size:17px; margin:2px 0 0; font-weight:800; letter-spacing:.01em;}
  .ring-wrap{position:relative; width:46px; height:46px; flex:0 0 auto;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-bg{fill:none; stroke:rgba(255,255,255,.22); stroke-width:4;}
  .ring-fg{fill:none; stroke:#fff; stroke-width:4; stroke-linecap:round; transition:stroke-dasharray .3s ease;}
  .ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800;}
  .meta-row{display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:2px;}
  .meta-field{flex:1 1 0; min-width:120px;}
  .meta-field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.75; margin-bottom:3px; font-weight:700;}
  .meta-field input{
    width:100%; padding:9px 10px; border-radius:9px; border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12); color:#fff; font-size:14px; font-weight:600;
  }
  .meta-field input::placeholder{color:rgba(255,255,255,.6); font-weight:500;}
  .meta-field input:focus{outline:2px solid #fff; background:rgba(255,255,255,.2);}

  /* ---------- layout ---------- */
  .wrap{max-width:640px; margin:0 auto; padding:14px 12px 120px;}
  .toolrow{display:flex; gap:8px; margin:12px 2px 14px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px;}
  .toolrow .pillbtn{flex:0 0 auto; white-space:nowrap;}
  .pillbtn{
    flex:1; border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:700;
    background:var(--card); color:var(--purple-800); border:1px solid var(--line); cursor:pointer;
  }
  .pillbtn.active{background:var(--purple-800); color:#fff; border-color:var(--purple-800);}

  .section{background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:12px; overflow:hidden;}
  .section-head{
    display:flex; align-items:center; gap:10px; width:100%; padding:14px 14px;
    background:#fff; border:none; text-align:left; cursor:pointer;
  }
  .sec-num{
    flex:0 0 auto; width:28px; height:28px; border-radius:8px; background:var(--purple-800); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
  }
  .sec-title{flex:1; font-weight:800; font-size:15px;}
  .sec-progress{font-size:12px; color:var(--ink-dim); font-weight:700;}
  .sec-chevron{transition:transform .2s ease; color:var(--ink-dim);}
  .section.open .sec-chevron{transform:rotate(180deg);}
  .sec-dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .dot-ok{background:var(--ok);} .dot-bad{background:var(--bad);} .dot-pending{background:#D8D2E2;}

  .sec-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .section.open .sec-body{max-height:none;}

  .item{padding:14px; border-top:1px solid var(--line);}
  .item-top{display:flex; gap:10px; align-items:flex-start;}
  .item-ref{flex:0 0 auto; font-size:11px; font-weight:800; color:#fff; background:var(--magenta);
    border-radius:6px; padding:3px 6px; margin-top:1px;}
  .item-text{flex:1; font-size:14.5px; line-height:1.35; font-weight:600;}

  .seg{display:flex; gap:6px; margin-top:10px;}
  .seg button{
    flex:1; padding:9px 0; border-radius:10px; border:1.5px solid var(--line); background:#fff;
    font-weight:800; font-size:13px; color:var(--ink-dim); cursor:pointer;
  }
  .seg button.y.sel{background:var(--ok-bg); border-color:var(--ok); color:var(--ok);}
  .seg button.n.sel{background:var(--bad-bg); border-color:var(--bad); color:var(--bad);}
  .seg button.na.sel{background:var(--na-bg); border-color:var(--na); color:var(--na);}

  .risk-row{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .risk-row label{font-size:11px; font-weight:700; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em;}
  .risk-select{
    flex:1; padding:7px 8px; border-radius:8px; border:1px solid var(--line); font-size:13px; font-weight:700; background:#fff;
  }
  .risk-select.r-none{color:var(--na);}
  .risk-select.r-low{color:var(--ok);}
  .risk-select.r-medium{color:var(--warn);}
  .risk-select.r-high{color:var(--bad);}

  .subrow{display:flex; gap:8px; margin-top:10px;}
  .ghostbtn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 8px; border-radius:10px; border:1.5px dashed var(--line); background:#fcfbfd;
    font-size:12.5px; font-weight:700; color:var(--purple-800); cursor:pointer;
  }
  .photo-native-wrap{margin-top:10px; border:1.5px dashed var(--line); border-radius:10px; background:#fcfbfd; overflow:hidden;}
  .photo-native-label{padding:8px 10px 0; font-size:12.5px; font-weight:700; color:var(--purple-800);}
  .photo-native-input{
    display:block; width:100%; padding:8px 10px 10px; border:none; background:transparent;
    font-size:12.5px; color:var(--ink-dim); box-sizing:border-box;
  }
  textarea.comment{
    width:100%; margin-top:10px; border:1px solid var(--line); border-radius:10px; padding:9px 10px;
    font-size:13.5px; resize:vertical; min-height:38px; display:none; background:#fcfbfd;
  }
  textarea.comment.show{display:block;}

  .photo-strip{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .photo-thumb{position:relative; width:96px; height:96px; border-radius:12px; overflow:hidden; border:1px solid var(--line); box-shadow:0 2px 6px rgba(42,15,69,.10);}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;}
  .photo-thumb .rm{
    position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; border:none; font-size:12px; line-height:22px; text-align:center; padding:0; cursor:pointer;
  }

  /* ---------- bottom bar ---------- */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:#fff; border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:10px; box-shadow:0 -6px 18px rgba(42,15,69,.08);
  }
  .bottombar .stat{flex:1; display:flex; flex-direction:column; justify-content:center;}
  .bottombar .stat b{font-size:15px;}
  .bottombar .stat span{font-size:11px; color:var(--ink-dim); font-weight:600;}
  .btn-primary{
    background:var(--magenta); color:#fff; border:none; border-radius:12px; padding:0 20px;
    font-weight:800; font-size:14px; cursor:pointer;
  }
  .btn-secondary{
    background:#fff; color:var(--purple-800); border:1.5px solid var(--purple-800); border-radius:12px; padding:0 16px;
    font-weight:800; font-size:14px; cursor:pointer;
  }

  /* ---------- review / print view : stc report format ---------- */
  #reviewOverlay{position:fixed; inset:0; background:#DCD6E4; z-index:100; overflow:auto; display:none;}
  #reviewOverlay.show{display:block;}
  .review-head{background:linear-gradient(135deg,var(--purple-950),var(--purple-800)); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5;}
  .review-head h2{margin:0; font-size:15px;}
  .closebtn{background:rgba(255,255,255,.15); border:none; color:#fff; width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; flex:0 0 auto;}
  .review-body{max-width:760px; margin:0 auto; padding:14px 10px 24px;}

  .rpt-sheet{background:#fff; border-radius:2px; overflow:hidden; box-shadow:0 6px 22px rgba(42,15,69,.18); margin-bottom:16px;}
  .rpt-banner{display:flex; align-items:stretch; min-height:64px;}
  .rpt-banner-left{flex:1; background:var(--purple-800); display:flex; align-items:center; padding:12px 16px;}
  .rpt-banner-left h1{color:#fff; font-size:16px; margin:0; letter-spacing:.03em; font-weight:800;}
  .rpt-banner-mid{width:14px; background:linear-gradient(90deg,var(--purple-800),var(--magenta));}
  .rpt-banner-right{width:130px; background:#fff; display:flex; align-items:center; justify-content:center; padding:10px;}
  .rpt-logo-img{max-width:100px; max-height:44px; display:block;}

  .rpt-info{width:100%; border-collapse:collapse; font-size:12.5px;}
  .rpt-info td{border:1px solid #D8D2E2; padding:8px 10px; vertical-align:top;}
  .rpt-info td.lbl{background:#F1EDF6; font-weight:800; width:23%; color:var(--purple-800);}
  .rpt-info td.val{width:27%; font-weight:600;}

  table.rpt-table{width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed;}
  table.rpt-table col.c-ref{width:32px;}
  table.rpt-table col.c-desc{width:auto;}
  table.rpt-table col.c-flag{width:26px;}
  table.rpt-table col.c-risk{width:58px;}
  table.rpt-table col.c-dept{width:90px;}
  table.rpt-table col.c-comment{width:20%;}
  .rpt-sec-row td{background:var(--purple-800); color:#fff; font-weight:800; font-size:12.5px; padding:7px 10px;}
  .rpt-head-row td{background:#EDE7F4; color:var(--purple-800); font-weight:800; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:5px 4px; text-align:center; border:1px solid #D8D2E2;}
  .rpt-head-row td.desc-h{text-align:left; padding-left:8px;}
  table.rpt-table td{border:1px solid #E3DEEC; padding:6px 5px; vertical-align:top; word-wrap:break-word;}
  td.rpt-ref{text-align:center; font-weight:700; color:var(--purple-800);}
  td.rpt-desc{line-height:1.35;}
  td.rpt-flag{text-align:center;}
  .flagmark{display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:3px; font-size:11px; font-weight:900;}
  .flagmark.on-y{background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok);}
  .flagmark.on-n{background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad);}
  .flagmark.on-na{background:var(--na-bg); color:var(--na); border:1px solid var(--na);}
  td.rpt-risk{text-align:center; font-weight:800; font-size:11px;}
  td.rpt-risk.risk-None{color:var(--na);}
  td.rpt-risk.risk-Low{color:var(--ok);}
  td.rpt-risk.risk-Medium{color:var(--warn);}
  td.rpt-risk.risk-High{color:var(--bad);}
  td.rpt-dept{text-align:center; font-weight:700; font-size:10.5px; color:var(--purple-800);}
  td.rpt-comment{font-size:11.5px; color:var(--ink-dim);}

  .rpt-photos-row td{padding:8px 10px 12px; background:#FBFAFC;}
  .rpt-photos{display:flex; flex-wrap:wrap; gap:10px;}
  .rpt-photo-block{width:230px;}
  .rpt-photo-block img{width:230px; height:230px; object-fit:cover; border-radius:8px; border:1px solid #D8D2E2; display:block; cursor:pointer;}
  .rpt-photo-block span{display:block; font-size:11px; color:var(--ink-dim); margin-top:4px; text-align:center; font-weight:600;}

  .rpt-footer{padding:10px 14px; text-align:center; font-size:10.5px; color:var(--ink-dim); border-top:1px solid #E3DEEC;}

  .rpt-appendix-title{background:var(--purple-800); color:#fff; font-weight:800; font-size:13.5px; padding:10px 14px;}
  .rpt-appendix-grid{display:flex; flex-wrap:wrap; gap:14px; padding:16px;}
  .rpt-appx-block{width:260px;}
  .rpt-appx-block img{width:260px; height:260px; object-fit:cover; border-radius:10px; border:1px solid #D8D2E2; display:block; cursor:pointer; box-shadow:0 2px 8px rgba(42,15,69,.08);}
  .rpt-appx-block .cap{font-size:13.5px; font-weight:800; color:var(--purple-800); margin-top:6px;}
  .rpt-appx-block .cmt{font-size:11px; color:var(--ink); margin-top:4px; font-style:italic; line-height:1.35; background:#F1EDF6; border-radius:6px; padding:5px 7px;}

  .rv-stats{display:flex; gap:10px; margin-bottom:14px;}
  .rv-help-note{
    background:#F1EDF6; border:1px solid #D8D2E2; border-radius:10px; padding:10px 12px;
    font-size:12.5px; color:var(--ink-dim); line-height:1.5; margin:14px 2px 4px;
  }
  .rv-help-note b{color:var(--purple-800);}
  .rv-stat-card{flex:1; background:#fff; border-radius:12px; padding:12px; text-align:center; box-shadow:0 2px 8px rgba(42,15,69,.08);}
  .rv-stat-card b{font-size:20px; display:block;}
  .rv-stat-card span{font-size:11px; color:var(--ink-dim); font-weight:700;}

  .rv-actions{display:flex; flex-wrap:wrap; gap:10px; padding:4px 2px 24px;}
  .rv-actions button{min-width:130px;}

  @media (max-width:600px){
    .rpt-sheet{overflow-x:auto;}
    table.rpt-table{min-width:640px;}
  }

  @media print{
    .topbar,.bottombar,.closebtn,.rv-actions,.review-head,.rv-help-note,.wrap{display:none !important;}
    #reviewOverlay{position:static; overflow:visible; background:#fff;}
    .review-body{padding:0; max-width:100%;}
    body{background:#fff;}
    .rpt-sheet{box-shadow:none; margin-bottom:0; page-break-after:always;}
    table.rpt-table{min-width:0;}
    .rpt-sec-row, tr{page-break-inside:avoid;}
    .rpt-photos-row{page-break-inside:avoid;}
    .rpt-appx-block{width:160px; page-break-inside:avoid;}
    .rpt-appx-block img{width:160px; height:160px;}
    .rpt-photo-block{width:160px;}
    .rpt-photo-block img{width:160px; height:160px;}
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
  }

  .toast{
    position:fixed; bottom:82px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600; z-index:200; opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}

  /* ---------- lightbox ---------- */
  #lightbox{position:fixed; inset:0; background:rgba(20,10,32,.94); z-index:300; display:none; align-items:center; justify-content:center; flex-direction:column; padding:20px;}
  #lightbox.show{display:flex;}
  #lightbox img{max-width:100%; max-height:80vh; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.5);}
  #lightbox .lb-cap{color:#fff; font-size:13px; font-weight:700; margin-top:14px;}
  #lightbox .lb-close{
    position:absolute; top:18px; right:18px; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.15); color:#fff; border:none; font-size:18px; cursor:pointer;
  }
</style>
</head>
<body>
<noscript>
  <div style="background:#D64545;color:#fff;padding:16px;font-family:sans-serif;font-size:14px;text-align:center;">
    This checklist needs JavaScript to load. Please open this file in Safari or Chrome (tap Share → Open in Browser) instead of a quick preview.
  </div>
</noscript>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <div class="eyebrow">stc &middot; Safety Management</div>
      <h1>Buildings Inspection</h1>
    </div>
    <div class="ring-wrap">
      <svg width="46" height="46" viewBox="0 0 46 46">
        <circle class="ring-bg" cx="23" cy="23" r="19"></circle>
        <circle class="ring-fg" id="ringFg" cx="23" cy="23" r="19" stroke-dasharray="0 119"></circle>
      </svg>
      <div class="ring-label" id="ringLabel">0%</div>
    </div>
  </div>
  <div class="meta-row">
    <div class="meta-field"><label>Building No.</label><input id="m-building" placeholder="e.g. A7"></div>
    <div class="meta-field"><label>Inspector</label><input id="m-inspector" placeholder="Full name"></div>
    <div class="meta-field"><label>Ref No.</label><input id="m-ref" placeholder="Auto or manual"></div>
    <div class="meta-field"><label>Date</label><input id="m-date" type="date"></div>
  </div>
</div>

<div class="wrap">
  <div class="toolrow">
    <button class="pillbtn active" id="filterAll">All items</button>
    <button class="pillbtn" id="filterFlagged">Flagged / N only</button>
  </div>
  <div id="sections"></div>
</div>

<div class="bottombar">
  <div class="stat"><b id="statDone">0 / 0</b><span>items answered</span></div>
  <button class="btn-primary" id="btnFinish">Review &amp; finish</button>
</div>

<div id="reviewOverlay">
  <div class="review-head">
    <h2>Inspection Summary</h2>
    <button class="closebtn" id="btnCloseReview">✕</button>
  </div>
  <div class="review-body" id="reviewBody"></div>
</div>

<div class="toast" id="toast"></div>

<div id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <img id="lbImg" src="" alt="Inspection photo">
  <div class="lb-cap" id="lbCap"></div>
</div>

/* build flat ref ids like 1.1, 1.2 ... */
CHECKLIST.forEach(sec=>{
  sec.refs = sec.items.map((_,i)=>`${sec.n}.${i+1}`);
});

/* ---------------- state ---------------- */
let state = {
  meta:{building:"", inspector:"", ref:"", date:""},
  answers:{}   // ref -> {val:'Y'|'N'|'NA'|null, risk:'None', comment:'', photos:[dataURL,...], department:''}
};
CHECKLIST.forEach(sec=>sec.refs.forEach(r=>{
  state.answers[r] = {val:null, risk:"Low", comment:"", photos:[], department: sec.dept};
}));

let activeFilter = "all";
let saveTimer = null;

const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; };

/* ---------------- render ---------------- */
function render(){
  const wrap = $("#sections");
  wrap.innerHTML = "";
  CHECKLIST.forEach(sec=>{
    const answeredCount = sec.refs.filter(r=>state.answers[r].val).length;
    const hasFail = sec.refs.some(r=>state.answers[r].val==="N");
    const secEl = el("div","section" + (sec.n===1?" open":""));
    secEl.dataset.sec = sec.n;

    const head = el("button","section-head");
    head.innerHTML = `
      <span class="sec-dot ${answeredCount===0?'dot-pending':(hasFail?'dot-bad':'dot-ok')}"></span>
      <span class="sec-num">${sec.n}</span>
      <span class="sec-title">${sec.title}</span>
      <span class="sec-progress">${answeredCount}/${sec.refs.length}</span>
      <span class="sec-chevron">▾</span>
    `;
    head.onclick = () => { secEl.classList.toggle("open"); };
    secEl.appendChild(head);

    const body = el("div","sec-body");
    let visibleCount = 0;
    sec.items.forEach((text, idx)=>{
      const ref = sec.refs[idx];
      const a = state.answers[ref];
      if(activeFilter === "flagged" && a.val !== "N"){ return; }
      visibleCount++;
      body.appendChild(renderItem(ref, text, a));
    });
    if(activeFilter === "flagged" && visibleCount === 0){
      body.appendChild(el("div","item","<div style='color:var(--ink-dim); font-size:13px;'>No flagged items in this section.</div>"));
    }
    secEl.appendChild(body);
    wrap.appendChild(secEl);
  });
  updateProgress();
}

function renderItem(ref, text, a){
  const item = el("div","item");
  item.dataset.ref = ref;

  const top = el("div","item-top");
  top.innerHTML = `<span class="item-ref">${ref}</span><span class="item-text">${text}</span>`;
  item.appendChild(top);

  const seg = el("div","seg");
  seg.innerHTML = `
    <button class="y ${a.val==='Y'?'sel':''}" data-v="Y">Yes</button>
    <button class="n ${a.val==='N'?'sel':''}" data-v="N">No</button>
    <button class="na ${a.val==='NA'?'sel':''}" data-v="NA">N/A</button>
  `;
  seg.querySelectorAll("button").forEach(btn=>{
    btn.onclick = () => {
      a.val = a.val === btn.dataset.v ? null : btn.dataset.v;
      if(a.val === "Y" || a.val === "NA" || a.val === null){ /* leave risk as-is */ }
      render();
      const secEl = document.querySelector(`.section[data-sec="${ref.split('.')[0]}"]`);
      if(secEl) secEl.classList.add("open");
    };
  });
  item.appendChild(seg);

  const riskRow = el("div","risk-row");
  const sel = el("select","risk-select r-" + a.risk.toLowerCase());
  ["None","Low","Medium","High"].forEach(r=>{
    const opt = el("option","",r); opt.value = r; if(r===a.risk) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { a.risk = sel.value; sel.className = "risk-select r-" + a.risk.toLowerCase(); };
  riskRow.innerHTML = `<label>Risk</label>`;
  riskRow.appendChild(sel);
  item.appendChild(riskRow);

  const deptRow = el("div","risk-row");
  const deptSel = el("select","risk-select");
  DEPARTMENTS.forEach(d=>{
    const opt = el("option","",d); opt.value = d; if(d === a.department) opt.selected = true;
    deptSel.appendChild(opt);
  });
  deptSel.onchange = () => { a.department = deptSel.value; };
  deptRow.innerHTML = `<label>Dept</label>`;
  deptRow.appendChild(deptSel);
  item.appendChild(deptRow);

  const subrow = el("div","subrow");
  const commentBtn = el("button","ghostbtn", (a.comment ? "💬 Edit comment" : "💬 Add comment"));
  commentBtn.type = "button";
  subrow.appendChild(commentBtn);
  item.appendChild(subrow);

  const photoWrap = el("div","photo-native-wrap");
  const photoLabel = el("div","photo-native-label", `📷 Add photo${a.photos.length? " · "+a.photos.length+" attached" : ""}`);
  const photoInput = el("input","photo-native-input");
  photoInput.type = "file";
  photoInput.accept = "image/*";
  photoInput.multiple = true;
  photoInput.addEventListener("change", (e)=>{
    handlePhotoFiles(ref, e.target.files);
    e.target.value = "";
  });
  photoWrap.appendChild(photoLabel);
  photoWrap.appendChild(photoInput);
  item.appendChild(photoWrap);

  const ta = el("textarea","comment" + (a.comment? " show":""));
  ta.placeholder = "Add a comment for this item…";
  ta.value = a.comment;
  ta.oninput = () => { a.comment = ta.value; };
  commentBtn.onclick = () => { ta.classList.toggle("show"); if(ta.classList.contains("show")) ta.focus(); };
  item.appendChild(ta);

  const strip = el("div","photo-strip");
  a.photos.forEach((src, pi)=>{
    const th = el("div","photo-thumb");
    th.innerHTML = `<img src="${src}"><button class="rm">✕</button>`;
    th.querySelector("img").onclick = () => openLightbox(src, `${ref} · Photo ${pi+1}`);
    th.querySelector(".rm").onclick = (ev) => { ev.stopPropagation(); a.photos.splice(pi,1); render(); };
    strip.appendChild(th);
  });
  item.appendChild(strip);

  return item;
}

function updateProgress(){
  const all = Object.values(state.answers);
  const done = all.filter(a=>a.val).length;
  const total = all.length;
  $("#statDone").textContent = `${done} / ${total}`;
  const pct = total? Math.round(done/total*100) : 0;
  const circumference = 2 * Math.PI * 19;
  $("#ringFg").setAttribute("stroke-dasharray", `${circumference*pct/100} ${circumference}`);
  $("#ringLabel").textContent = pct + "%";
}

/* ---------------- photo capture (compress before storing) ---------------- */
function handlePhotoFiles(ref, files){
  files = Array.from(files || []);
  if(!files.length) return;
  let remaining = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1600;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
        state.answers[ref].photos.push(dataUrl);
        remaining--;
        if(remaining === 0){ render(); }
      };
      img.onerror = ()=>{ remaining--; toast("Could not read that photo"); };
      img.src = ev.target.result;
    };
    reader.onerror = ()=>{ remaining--; toast("Could not read that photo"); };
    reader.readAsDataURL(file);
  });
}

/* ---------------- meta fields ---------------- */
["building","inspector","ref","date"].forEach(k=>{
  const input = $("#m-"+k);
  input.addEventListener("input", ()=>{ state.meta[k] = input.value; });
});

/* ---------------- filters ---------------- */
$("#filterAll").onclick = ()=>{ activeFilter="all"; $("#filterAll").classList.add("active"); $("#filterFlagged").classList.remove("active"); render(); };
$("#filterFlagged").onclick = ()=>{ activeFilter="flagged"; $("#filterFlagged").classList.add("active"); $("#filterAll").classList.remove("active"); render(); };

/* ---------------- functions used by finish/report ---------------- */

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ---------------- lightbox ---------------- */
function openLightbox(src, caption){
  $("#lbImg").src = src;
  $("#lbCap").textContent = caption || "";
  $("#lightbox").classList.add("show");
}
function closeLightbox(){ $("#lightbox").classList.remove("show"); }
$("#lbClose").onclick = closeLightbox;
$("#lightbox").addEventListener("click", (e)=>{ if(e.target.id === "lightbox") closeLightbox(); });

/* ---------------- review / finish : builds stc-format report ---------------- */
function flagCell(val, target){
  const on = val === target;
  const cls = target==="Y"?"on-y":target==="N"?"on-n":"on-na";
  const mark = target==="Y"?"✓":target==="N"?"✕":"–";
  return `<td class="rpt-flag">${on ? `<span class="flagmark ${cls}">${mark}</span>` : ""}</td>`;
}

/* Download a self-contained copy of the report as a plain .html file.
   Uses only a Blob + anchor-download — no print API, no external
   libraries, no popups. The most reliable fallback available: it works
   the same way any website's "download file" button works. The saved
   file can be opened and printed/shared later from Files. */
function downloadReportHtml(sheetEl){
  try{
    const styleTag = document.querySelector("style");
    const cssText = styleTag ? styleTag.innerHTML : "";
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Inspection Report</title>
      <style>${cssText}
        html,body{background:#fff; margin:0; padding:16px;}
        .rpt-sheet{box-shadow:none; margin-bottom:0;}
      </style></head>
      <body>${sheetEl.outerHTML}</body></html>`;
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const bld = (state.meta.building || "report").trim().replace(/\s+/g,"_");
    const dt = state.meta.date || "";
    const a = document.createElement("a");
    a.href = url;
    a.download = `Inspection_${bld}_${dt}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    toast("Report file downloaded");
  }catch(err){
    console.error("Download error", err);
    toast("Could not download the report");
  }
}


$("#btnFinish").onclick = ()=>{
  const body = $("#reviewBody");
  body.innerHTML = "";

  const all = Object.values(state.answers);
  const failCount = all.filter(a=>a.val==="N").length;
  const doneCount = all.filter(a=>a.val).length;

  const stats = el("div","rv-stats");
  stats.innerHTML = `
    <div class="rv-stat-card"><b>${doneCount}/${all.length}</b><span>ITEMS ANSWERED</span></div>
    <div class="rv-stat-card"><b style="color:${failCount? 'var(--bad)':'var(--ok)'};">${failCount}</b><span>NON-CONFORMANCES</span></div>
  `;
  body.appendChild(stats);

  const sheet = el("div","rpt-sheet");

  sheet.innerHTML = `
    <div class="rpt-banner">
      <div class="rpt-banner-left"><h1>BUILDINGS INSPECTION REPORT</h1></div>
      <div class="rpt-banner-mid"></div>
      <div class="rpt-banner-right"><img class="rpt-logo-img" src="${STC_LOGO}" alt="stc logo"></div>
    </div>
    <table class="rpt-info">
      <tr>
        <td class="lbl">Building Number</td><td class="val">${escapeHtml(state.meta.building) || "—"}</td>
        <td class="lbl">Inspection Ref No.</td><td class="val">${escapeHtml(state.meta.ref) || "—"}</td>
      </tr>
      <tr>
        <td class="lbl">Inspector Name</td><td class="val">${escapeHtml(state.meta.inspector) || "—"}</td>
        <td class="lbl">Date of Inspection</td><td class="val">${escapeHtml(state.meta.date) || "—"}</td>
      </tr>
    </table>
  `;

  const table = el("table","rpt-table");
  table.innerHTML = `<colgroup>
    <col class="c-ref"><col class="c-desc"><col class="c-flag"><col class="c-flag"><col class="c-flag"><col class="c-risk"><col class="c-dept"><col class="c-comment">
  </colgroup>`;
  const tbody = el("tbody");

  CHECKLIST.forEach(sec=>{
    const secHasContent = sec.refs.some(r=> state.answers[r].val || state.answers[r].comment || state.answers[r].photos.length);
    const secRow = el("tr","rpt-sec-row");
    secRow.innerHTML = `<td colspan="8">Ref No:${sec.n}&nbsp;&nbsp;${sec.title}</td>`;
    tbody.appendChild(secRow);

    const headRow = el("tr","rpt-head-row");
    headRow.innerHTML = `<td>Ref</td><td class="desc-h">Description</td><td>Y</td><td>N</td><td>NA</td><td>Risk</td><td>Dept</td><td>Comments</td>`;
    tbody.appendChild(headRow);

    sec.items.forEach((text, idx)=>{
      const ref = sec.refs[idx];
      const a = state.answers[ref];
      const row = el("tr");
      row.innerHTML = `
        <td class="rpt-ref">${ref}</td>
        <td class="rpt-desc">${escapeHtml(text)}</td>
        ${flagCell(a.val,"Y")}
        ${flagCell(a.val,"N")}
        ${flagCell(a.val,"NA")}
        <td class="rpt-risk risk-${a.risk}">${a.risk}</td>
        <td class="rpt-dept">${escapeHtml(a.department)}</td>
        <td class="rpt-comment">${escapeHtml(a.comment) || ""}</td>
      `;
      tbody.appendChild(row);
    });
  });
  table.appendChild(tbody);
  sheet.appendChild(table);

  // Photo appendix: every photo, full size, grouped in ref order, with observation + comment
  const allPhotoRefs = [];
  CHECKLIST.forEach(sec=> sec.refs.forEach(ref=>{
    const a = state.answers[ref];
    if(a.photos.length) allPhotoRefs.push({ref, a});
  }));
  if(allPhotoRefs.length){
    const appxTitle = el("div","rpt-appendix-title", `Photo Appendix — ${allPhotoRefs.reduce((n,x)=>n+x.a.photos.length,0)} photo(s)`);
    sheet.appendChild(appxTitle);
    const grid = el("div","rpt-appendix-grid");
    allPhotoRefs.forEach(({ref,a})=>{
      a.photos.forEach((src,pi)=>{
        const blk = el("div","rpt-appx-block");
        blk.innerHTML = `
          <img src="${src}">
          <div class="cap">${ref}</div>
          ${a.comment ? `<div class="cmt">${escapeHtml(a.comment)}</div>` : ""}
        `;
        blk.querySelector("img").onclick = () => openLightbox(src, `${ref} · Photo ${pi+1}`);
        grid.appendChild(blk);
      });
    });
    sheet.appendChild(grid);
  }

  const footer = el("div","rpt-footer","Internal &middot; stc Safety Management Department");
  sheet.appendChild(footer);

  body.appendChild(sheet);

  const helpNote = el("div","rv-help-note",
    "<b>Print</b> opens your device's print dialog directly. If that doesn't respond, use <b>Download Report</b> to save the file, then open it and print/share from there.");
  body.appendChild(helpNote);

  const actions = el("div","rv-actions");
  const printBtn = el("button","btn-primary","🖨 Print / Save as PDF");
  printBtn.style.flex="1";
  printBtn.type="button";
  printBtn.onclick = ()=> window.print();
  const downloadBtn = el("button","btn-secondary","⬇ Download Report");
  downloadBtn.style.flex="1";
  downloadBtn.type="button";
  downloadBtn.onclick = ()=> downloadReportHtml(sheet);
  const backBtn = el("button","btn-secondary","Back to checklist");
  backBtn.style.flex="1";
  backBtn.type="button";
  backBtn.onclick = closeReview;
  actions.appendChild(printBtn);
  actions.appendChild(downloadBtn);
  actions.appendChild(backBtn);
  body.appendChild(actions);

  $("#reviewOverlay").classList.add("show");
};
function escapeHtml(str){
  if(!str) return "";
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function closeReview(){ $("#reviewOverlay").classList.remove("show"); }
$("#btnCloseReview").onclick = closeReview;

/* ---------------- init ---------------- */
function boot(){
  try{
    const today = new Date().toISOString().slice(0,10);
    $("#m-date").value = today;
    state.meta.date = today;
    render();
  }catch(err){
    console.error("Init error", err);
    document.body.insertAdjacentHTML("afterbegin",
      '<div style="background:#D64545;color:#fff;padding:12px 16px;font-size:13px;font-weight:600;">'+
      'This page needs to run in a full browser. Tap Share → Open in Safari (or your browser) instead of the quick preview.</div>');
  }
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
}else{
  boot();
}
</script>
